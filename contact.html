<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | CSP ASSO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div id="app-header"></div>
    <main class="max-w-3xl mx-auto px-4 py-10">
        <h1 class="text-3xl font-bold text-blue-900 mb-6">Nous contacter</h1>
        <div id="cartes" class="grid grid-cols-1 sm:grid-cols-2 gap-6"></div>
    </main>
    <div id="app-footer"></div>
    <script src="layout.js"></script>
    <script>
        CSP.infos().then((i) => {
            const c = [
                ['adresse', 'fa-location-dot', 'Adresse'],
                ['telephone', 'fa-phone', 'Téléphone'],
                ['email', 'fa-envelope', 'E-mail'],
                ['horaires', 'fa-clock', 'Horaires'],
            ];
            document.getElementById('cartes').innerHTML = c.map(([k, ico, titre]) => {
                const v = i[k];
                let val = v ? CSP.esc(v) : '<span class="text-gray-400">Bientôt disponible</span>';
                if (v && k === 'telephone') val = `<a class="text-blue-600 hover:underline" href="tel:${CSP.esc(v.replace(/[^+\d]/g, ''))}">${CSP.esc(v)}</a>`;
                if (v && k === 'email') val = `<a class="text-blue-600 hover:underline" href="mailto:${CSP.esc(v)}">${CSP.esc(v)}</a>`;
                return `<div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-blue-600">
                    <div class="text-blue-600 text-2xl mb-2"><i class="fa-solid ${ico}"></i></div>
                    <h2 class="font-bold mb-1">${titre}</h2><p class="text-gray-700 whitespace-pre-line">${val}</p></div>`;
            }).join('');
        });
    </script>
</body>
</html>
