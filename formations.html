<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formations | CSP ASSO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div id="app-header"></div>
    <main class="max-w-5xl mx-auto px-4 py-10">
        <h1 class="text-3xl font-bold text-blue-900 mb-6">Nos formations</h1>
        <div id="liste" class="grid grid-cols-1 md:grid-cols-2 gap-6"><p class="text-gray-500">Chargement…</p></div>
        <div class="text-center mt-8">
            <a href="inscription.html" class="inline-block bg-yellow-500 hover:bg-yellow-400 text-blue-950 font-bold px-8 py-3 rounded-lg shadow transition">S'inscrire en ligne</a>
        </div>
    </main>
    <div id="app-footer"></div>
    <script src="layout.js"></script>
    <script>
        // Format de l'info « formations » (une par ligne) :  Titre : description
        CSP.infos().then((i) => {
            const lignes = (i.formations || '').split('\n').map((l) => l.trim()).filter(Boolean);
            document.getElementById('liste').innerHTML = lignes.length
                ? lignes.map((l) => {
                    const k = l.indexOf(':');
                    const titre = k > 0 ? l.slice(0, k).trim() : l;
                    const desc = k > 0 ? l.slice(k + 1).trim() : '';
                    return `<div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-blue-600">
                        <h2 class="text-xl font-bold mb-2">${CSP.esc(titre)}</h2>
                        <p class="text-gray-600">${CSP.esc(desc)}</p></div>`;
                }).join('')
                : '<p class="text-gray-500 md:col-span-2">La liste des formations sera bientôt publiée.</p>';
        });
    </script>
</body>
</html>
