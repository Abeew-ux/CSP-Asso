<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>À propos | CSP ASSO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div id="app-header"></div>
    <main class="max-w-4xl mx-auto px-4 py-10">
        <h1 class="text-3xl font-bold text-blue-900 mb-6">À propos du CSP ASSO</h1>
        <div id="texte" class="bg-white p-6 rounded-xl shadow-md border-t-4 border-blue-600 text-gray-700 whitespace-pre-line">Chargement…</div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mt-8">
            <div class="bg-white p-6 rounded-xl shadow border-t-4 border-yellow-500 text-center">
                <div class="text-yellow-500 text-3xl mb-3"><i class="fa-solid fa-star"></i></div>
                <h2 class="font-bold text-lg mb-1">Excellence</h2>
                <p class="text-gray-600 text-sm">Accompagner chaque élève vers la réussite.</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow border-t-4 border-blue-900 text-center">
                <div class="text-blue-900 text-3xl mb-3"><i class="fa-solid fa-scale-balanced"></i></div>
                <h2 class="font-bold text-lg mb-1">Discipline</h2>
                <p class="text-gray-600 text-sm">Un cadre rigoureux pour apprendre sereinement.</p>
            </div>
        </div>
    </main>
    <div id="app-footer"></div>
    <script src="layout.js"></script>
    <script>
        CSP.infos().then((i) => {
            document.getElementById('texte').textContent = i.apropos ||
                "Le Complexe Scolaire Privé CSP ASSO accompagne ses élèves vers l'excellence dans la discipline. La présentation complète de l'établissement sera bientôt publiée ici.";
        });
    </script>
</body>
</html>
